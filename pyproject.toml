[project]
name = "newspace-analytics-benchmark"
version = "1.0.0"
description = "Benchmarking de Mineração de Dados, Análise de Tendências de Produção de Informações, Dashboard Customizável e Relatório de Decisão para Operações NewSpace (Dados Reais NASA JPL, NORAD/CelesTrak e GCAT)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.15.0",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "plotly>=5.24.0",
    "ipywidgets>=8.1.5",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "jupyter>=1.1.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "tabulate>=0.9.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
